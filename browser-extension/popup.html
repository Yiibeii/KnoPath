<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Chat Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Chat Exporter</h1>
      <p class="subtitle">导出 AI 对话记录</p>
    </header>

    <div id="status" class="status-box">
      <span class="status-icon">🔍</span>
      <span id="status-text">检测当前页面...</span>
    </div>

    <div id="platform-info" class="platform-info" style="display: none;">
      <span class="platform-label">当前平台:</span>
      <span id="platform-name" class="platform-name"></span>
    </div>

    <div id="chat-info" class="chat-info" style="display: none;">
      <div class="info-row">
        <span>对话数量:</span>
        <span id="chat-count">0</span>
      </div>
    </div>

    <div class="actions">
      <button id="btn-export" class="btn btn-primary" disabled>
        <span class="btn-icon">📥</span>
        导出当前对话
      </button>
    </div>

    <div class="format-selector">
      <label>导出格式:</label>
      <select id="format">
        <option value="knopath">JSON (推荐)</option>
        <option value="markdown">Markdown</option>
      </select>
    </div>

    <footer>
      <p>支持: 豆包 | Kimi | DeepSeek | 千问 | ChatGPT | Claude</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>

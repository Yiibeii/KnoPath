<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons - AI Chat Exporter</title>
  <style>
    :root {
      --olive-accent: #4a7c59;
      --olive-dark: #3d6b4a;
      --olive-light: #6b9b6e;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      padding: 40px;
      background: #f8faf8;
      color: #333;
    }
    h1 { color: var(--olive-accent); }
    .icon-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    canvas { 
      border: 1px solid #e0e0e0; 
      border-radius: 8px;
    }
    .download-btn { 
      padding: 10px 20px;
      cursor: pointer;
      background: var(--olive-accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .download-btn:hover {
      background: var(--olive-dark);
    }
    .size-label {
      font-weight: 600;
      color: var(--olive-accent);
    }
  </style>
</head>
<body>
  <h1>AI Chat Exporter Icon Generator</h1>
  <p>Click the buttons below to download PNG icons for the browser extension.</p>
  
  <div class="icon-row">
    <span class="size-label">16×16</span>
    <canvas id="icon16" width="16" height="16"></canvas>
    <button class="download-btn" data-size="16">Download icon16.png</button>
  </div>
  
  <div class="icon-row">
    <span class="size-label">48×48</span>
    <canvas id="icon48" width="48" height="48"></canvas>
    <button class="download-btn" data-size="48">Download icon48.png</button>
  </div>
  
  <div class="icon-row">
    <span class="size-label">128×128</span>
    <canvas id="icon128" width="128" height="128"></canvas>
    <button class="download-btn" data-size="128">Download icon128.png</button>
  </div>

  <script>
    const OLIVE_ACCENT = '#4a7c59';
    const OLIVE_LIGHT = '#6b9b6e';

    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const scale = size / 128;

      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, OLIVE_ACCENT);
      gradient.addColorStop(1, OLIVE_LIGHT);

      ctx.beginPath();
      const radius = 24 * scale;
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.fillStyle = 'white';
      
      const barHeight = 8 * scale;
      const barRadius = 4 * scale;
      
      function drawRoundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();
      }

      drawRoundedRect(24 * scale, 28 * scale, 56 * scale, barHeight, barRadius);
      drawRoundedRect(24 * scale, 44 * scale, 80 * scale, barHeight, barRadius);
      drawRoundedRect(24 * scale, 60 * scale, 40 * scale, barHeight, barRadius);
      drawRoundedRect(24 * scale, 84 * scale, 80 * scale, barHeight, barRadius);
      drawRoundedRect(24 * scale, 100 * scale, 56 * scale, barHeight, barRadius);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.arc(96 * scale, 96 * scale, 24 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = OLIVE_ACCENT;
      ctx.beginPath();
      ctx.moveTo(88 * scale, 96 * scale);
      ctx.lineTo(96 * scale, 88 * scale);
      ctx.lineTo(96 * scale, 104 * scale);
      ctx.closePath();
      ctx.fill();
      
      ctx.beginPath();
      ctx.moveTo(104 * scale, 96 * scale);
      ctx.lineTo(96 * scale, 104 * scale);
      ctx.lineTo(96 * scale, 88 * scale);
      ctx.closePath();
      ctx.fill();
    }

    [16, 48, 128].forEach(size => {
      const canvas = document.getElementById('icon' + size);
      drawIcon(canvas);
    });

    document.querySelectorAll('.download-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const size = btn.dataset.size;
        const canvas = document.getElementById('icon' + size);
        const link = document.createElement('a');
        link.download = 'icon' + size + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
</body>
</html>
